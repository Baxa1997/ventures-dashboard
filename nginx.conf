server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # The staff panel: kept out of search results and out of other sites' frames.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Vite names every file under /assets by its content, so a file there never changes.
    # A missing one is a 404, not index.html served as a script.
    location /assets/ {
        expires max;
        try_files $uri =404;
    }

    # Any other path is a page of the app (BrowserRouter). index.html is checked on every
    # visit, so a new build reaches people without a hard reload.
    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
